<!DOCTYPE html>
<html>
<head>
<title>Cart</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
</head>

<body>

<h1>Shopping Cart</h1>

{% for item in items %}

<div class="cart-item">

<img src="{{ url_for('static',
filename='images/' + item.image) }}">

<h3>{{ item.name }}</h3>

<p>₹{{ item.price }}</p>

<a href="/remove/{{ item.id }}">
<button>Remove</button>
</a>

</div>

{% endfor %}

<h2>Total = ₹{{ total }}</h2>

<a href="/home">Back</a>

</body>
</html>
